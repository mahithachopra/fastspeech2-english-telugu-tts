# English: merged copy of config_dir/{preprocess,model,train}.yaml (the code reads the three separate files)
preprocess:
  dataset: "English"
  path:
    corpus_path: "/kaggle/working/seg/English/raw"
    lexicon_path: "lexicon/librispeech-lexicon.txt"
    raw_path: "/kaggle/working/seg/English/raw"
    preprocessed_path: "./preprocessed_data/English"
    manifest_path: "/kaggle/working/seg/English/English_manifest.csv"
  preprocessing:
    val_size: 0
    text:
      text_cleaners: ["english_cleaners"]
      language: "en"
    audio: {sampling_rate: 22050, max_wav_value: 32768.0}
    stft: {filter_length: 1024, hop_length: 256, win_length: 1024}
    mel: {n_mel_channels: 80, mel_fmin: 0, mel_fmax: 8000}
    pitch: {feature: "phoneme_level", normalization: True}
    energy: {feature: "phoneme_level", normalization: True}
model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2

  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5

  variance_embedding:
    pitch_quantization: "linear" # support 'linear' or 'log', 'log' is allowed only if the pitch values are not normalized during preprocessing
    energy_quantization: "linear" # support 'linear' or 'log', 'log' is allowed only if the energy values are not normalized during preprocessing
    n_bins: 256

  # gst:
  #   use_gst: False
  #   conv_filters: [32, 32, 64, 64, 128, 128]
  #   gru_hidden: 128
  #   token_size: 128
  #   n_style_token: 10
  #   attn_head: 4

  multi_speaker: True

  max_seq_len: 1000

  vocoder:
    model: "HiFi-GAN" # support 'HiFi-GAN', 'MelGAN'
    speaker: "universal" # support  'LJSpeech', 'universal'
train:
  path:
    ckpt_path: "./checkpoints"
    log_path: "./output/log"
    result_path: "./output/result"
  optimizer:
    batch_size: 16
    betas: [0.9, 0.98]
    eps: 0.000000001
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 2000
    anneal_steps: [14000, 18000]
    anneal_rate: 0.3
  step:
    total_step: 20000
    log_step: 100
    synth_step: 1000
    val_step: 1000
    save_step: 5000
