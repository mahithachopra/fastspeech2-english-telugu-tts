path:
  ckpt_path: "./checkpoints"
  log_path: "./output/log"
  result_path: "./output/result"
optimizer:
  batch_size: 8
  betas: [0.9, 0.98]
  eps: 0.000000001
  weight_decay: 0.0
  grad_clip_thresh: 1.0
  grad_acc_step: 2
  warm_up_step: 2000
  anneal_steps: [20000, 26000]
  anneal_rate: 0.3
step:
  total_step: 30000
  log_step: 100
  synth_step: 1000
  val_step: 1000
  save_step: 5000
